</style></head><body><div class="wrap"><div class="toolbar"><a class="btn" href="index.html">← Student Portal</a><button class="btn primary" onclick="window.print()">🖨 Print Certificate</button></div><div id="guard" style="text-align:center;color:#94a3b8">Loading certificate…</div><div id="certificate" class="cert" style="display:none"><div class="brand">NextGen DevSecOps AI</div><div class="eyebrow">Certificate of Completion</div><h1>Certificate of Completion</h1><p>This certificate is proudly presented to</p><h2 id="studentName">Student</h2><p>for successfully completing the training program</p><h2 id="courseName">Course</h2><p>Issued by NextGen DevSecOps AI</p><div class="number" id="certificateNumber"></div><div class="date" id="issuedDate"></div></div></div>

const URL='https://hkpvigvtdckxhmnsvdrh.supabase.co',KEY='sb_publishable_JlIrNdsEXgjikrh9F_YxYg_DBrgimoQ';const client=window.supabase.createClient(URL,KEY);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

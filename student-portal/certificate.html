<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Certificate | NextGen DevSecOps AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a12;color:#f8fafc;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.top{height:70px;border-bottom:1px solid #252d43;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.logo{font-weight:900}.logo span{color:#a78bfa}.actions{display:flex;gap:8px}.btn{border:1px solid #39435e;background:#12192a;color:#fff;border-radius:9px;padding:9px 13px;font-weight:800;font-size:12px;text-decoration:none}.btn.primary{background:linear-gradient(135deg,#7c3aed,#06b6d4);border:0}.wrap{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:35px}.certificate{width:min(1000px,100%);aspect-ratio:1.414/1;background:#fff;color:#172033;border:12px solid #e8e9f2;box-shadow:0 25px 80px rgba(0,0,0,.35);padding:54px;position:relative;text-align:center;display:flex;flex-direction:column;justify-content:center}.certificate:before{content:"";position:absolute;inset:18px;border:1px solid #c9cde0;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:4px;font-weight:900;color:#6d4aff}.brand{font-size:17px;font-weight:900;letter-spacing:.5px;margin-bottom:26px}.brand span{color:#6d4aff}.certificate h1{font-family:Georgia,serif;font-size:48px;letter-spacing:1px;margin:0 0 10px}.sub{font-size:15px;color:#667085}.name{font-family:Georgia,serif;font-size:39px;font-weight:700;margin:20px 0 8px;color:#101828}.course{font-size:22px;font-weight:800;color:#25304a;margin:10px auto;max-width:760px}.details{font-size:12px;color:#667085;margin-top:15px}.signatures{display:flex;justify-content:space-around;gap:30px;margin-top:42px;font-size:11px;color:#667085}.signature{min-width:200px;border-top:1px solid #9aa2b5;padding-top:8px}.loading{color:#9aa5b8;text-align:center}.error{max-width:500px;text-align:center;color:#fca5a5}.print-note{font-size:10px;color:#98a2b3;margin-top:15px}@media(max-width:650px){.top{padding:0 14px}.wrap{padding:15px}.certificate{padding:30px 20px;border-width:7px}.certificate:before{inset:10px}.certificate h1{font-size:32px}.name{font-size:27px}.course{font-size:17px}.signatures{margin-top:25px;gap:10px}.signature{min-width:0;flex:1}.actions .btn:first-child{display:none}}
@media print{body{background:#fff}.top,.print-note{display:none}.wrap{min-height:100vh;padding:0}.certificate{width:100%;box-shadow:none;border:12px solid #e8e9f2;page-break-inside:avoid}.certificate:before{inset:18px}}
</style></head><body>
<header class="top"><div class="logo">NextGen <span>DevSecOps AI</span></div><div class="actions"><a class="btn" href="index.html">← Student Portal</a><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div></header>
<main class="wrap"><div id="state" class="loading">Loading certificate…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\\/script>')}</script>
<script>
window.NEXTGEN_SUPABASE_URL=window.NEXTGEN_SUPABASE_URL||'https://hkpvigvtdckxhmnsvdrh.supabase.co';window.NEXTGEN_SUPABASE_ANON_KEY=window.NEXTGEN_SUPABASE_ANON_KEY||'sb_publishable_JlIrNdsEXgjikrh9F_YxYg_DBrgimoQ';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function date(v){if(!v)return '—';return new Date(v).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});}
async function boot(){const state=document.getElementById('state');try{if(!window.supabase?.createClient)throw new Error('Supabase library failed to load.');const sb=window.supabase.createClient(window.NEXTGEN_SUPABASE_URL,window.NEXTGEN_SUPABASE_ANON_KEY);const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html');return;}const {data:u}=await sb.auth.getUser();if(!u?.user)throw new Error('Login session not found.');const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Certificate ID is missing.');const {data:c,error}=await sb.from('certificates').select('id,certificate_number,issued_at,course_id,courses(name),profiles:student_id(full_name,student_id)').eq('id',id).eq('student_id',u.user.id).single();if(error)throw error;if(!c)throw new Error('Certificate not found or access denied.');state.outerHTML=`<article class="certificate"><div class="eyebrow">CERTIFICATE OF COMPLETION</div><div class="brand">NextGen <span>DevSecOps AI</span></div><div class="sub">This certificate is proudly presented to</div><div class="name">${esc(c.profiles?.full_name||'Student')}</div><div class="sub">for successfully completing</div><div class="course">${esc(c.courses?.name||'Training Program')}</div><div class="details">Certificate ID: <strong>${esc(c.certificate_number||c.id)}</strong> &nbsp;•&nbsp; Issued: <strong>${date(c.issued_at)}</strong>${c.profiles?.student_id?' &nbsp;•&nbsp; Student ID: <strong>'+esc(c.profiles.student_id)+'</strong>':''}</div><div class="signatures"><div class="signature"><strong>Mukul Malhotra</strong><br>Trainer &amp; Technology Mentor</div><div class="signature"><strong>NextGen DevSecOps AI</strong><br>Training &amp; Consulting</div></div><div class="print-note">Use “Print / Save PDF” to create a shareable PDF copy.</div></article>`;}catch(e){console.error(e);state.className='error';state.innerHTML='<strong>Unable to load certificate.</strong><br><br>'+esc(e.message||'Please return to the Student Portal and try again.');}}boot();
</script></body></html>

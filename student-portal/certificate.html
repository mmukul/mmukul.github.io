<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Certificate | NextGen DevSecOps AI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,rgba(124,58,237,.22),transparent 30%),radial-gradient(circle at 85% 100%,rgba(6,182,212,.16),transparent 32%),#070b18;color:#f8fafc;font-family:Inter,system-ui,Arial;display:grid;place-items:center;padding:28px}.wrap{width:min(980px,100%)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900}.brand span{color:#a78bfa}.actions{display:flex;gap:9px}.btn{padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#111827;color:#fff;text-decoration:none;font-weight:800;font-size:12px;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,#7c3aed,#0891b2)}.certificate{position:relative;background:linear-gradient(145deg,#111a31,#0b1122);border:1px solid rgba(167,139,250,.45);border-radius:28px;padding:58px 64px;text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.45);overflow:hidden}.certificate:before{content:"";position:absolute;inset:14px;border:1px solid rgba(34,211,238,.18);border-radius:20px;pointer-events:none}.kicker{color:#67e8f9;letter-spacing:3px;font-size:11px;font-weight:900}.title{font-size:42px;margin:15px 0 6px;letter-spacing:-1.5px}.subtitle{color:#94a3b8;font-size:13px}.name{font-size:38px;color:#e9d5ff;margin:32px 0 10px;font-weight:900}.course{font-size:19px;font-weight:800;color:#e2e8f0}.meta{margin:30px auto 0;display:flex;justify-content:center;gap:35px;color:#94a3b8;font-size:11px}.meta strong{display:block;color:#e2e8f0;font-size:13px;margin-top:5px}.seal{margin:32px auto 0;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(34,211,238,.4);background:rgba(34,211,238,.06);color:#67e8f9;font-size:28px}@media print{body{background:#fff;color:#111}.top{display:none}.certificate{box-shadow:none;background:#fff;color:#111;border:2px solid #555}.subtitle,.meta{color:#555}.course{color:#111}.name{color:#5b21b6}}@media(max-width:600px){.certificate{padding:42px 24px}.title{font-size:31px}.name{font-size:28px}.meta{gap:15px;flex-wrap:wrap}}</style></head><body><div class="wrap"><div class="top"><div class="brand">NextGen <span>DevSecOps AI</span></div><div class="actions"><a class="btn" href="./">← Student Portal</a><button class="btn primary" onclick="window.print()">Print Certificate</button></div></div><div id="message" class="certificate"><div class="kicker">CERTIFICATE OF COMPLETION</div><div class="title">Certificate of Achievement</div><div class="subtitle">This certificate is proudly presented to</div><div id="name" class="name">Loading…</div><div class="subtitle">for successfully completing</div><div id="course" class="course">Loading course…</div><div class="meta"><div>Certificate ID<strong id="number">—</strong></div><div>Issue Date<strong id="date">—</strong></div></div><div class="seal">✓</div><div class="subtitle" style="margin-top:20px">NextGen DevSecOps AI • Learn • Build • Secure • Innovate</div></div></div><script>const URL='https://hkpvigvtdckxhmnsvdrh.supabase.co',KEY='sb_publishable_JlIrNdsEXgjikrh9F_YxYg_DBrgimoQ';const c=window.supabase.createClient(URL,KEY);const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));(async()=>{try{const {data:{session}}=await c.auth.getSession();if(!session){location.replace('login.html');return}const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Certificate ID is missing.');const {data:cert,error}=await c.from('certificates').select('id,student_id,course_id,certificate_number,issued_at,courses(name)').eq('id',id).eq('student_id',session.user.id).maybeSingle();if(error)throw error;if(!cert)throw new Error('Certificate not found or access is not permitted.');const {data:p,error:pe}=await c.from('profiles').select('full_name').eq('id',session.user.id).maybeSingle();if(pe)throw pe;if(!p?.full_name)throw new Error('Student name is missing from your profile.');document.getElementById('name').textContent=p.full_name;document.getElementById('course').textContent=cert.courses?.name||'Course Completion';document.getElementById('number').textContent=cert.certificate_number||'Not assigned';document.getElementById('date').textContent=cert.issued_at?new Date(cert.issued_at).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'}):'Not specified';}catch(e){document.getElementById('message').innerHTML='<div class="kicker">CERTIFICATE</div><div class="title">Unable to load</div><div class="subtitle">'+esc(e.message||'Certificate could not be loaded.')+'</div>'}})();</script></body></html>

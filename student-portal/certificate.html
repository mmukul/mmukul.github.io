<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Certificate | NextGen DevSecOps AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1c;color:#e5e7eb;font-family:Inter,system-ui,sans-serif;min-height:100vh;padding:30px}
.wrap{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.logo{font-weight:900;color:#fff;text-decoration:none}.logo span{color:#a78bfa}.actions{display:flex;gap:10px}.btn{display:inline-block;padding:10px 15px;border-radius:9px;border:1px solid #334155;color:#e2e8f0;text-decoration:none;background:#111827;cursor:pointer}.primary{background:linear-gradient(100deg,#7c3aed,#06b6d4);border:0;color:#fff}
.card{background:rgba(15,23,42,.95);border:1px solid rgba(148,163,184,.2);border-radius:20px;padding:48px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.4)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:2px;color:#22d3ee}.title{font-size:38px;margin:15px 0 8px}.name{font-size:32px;font-weight:900;color:#c4b5fd;margin:28px 0 10px}.course{font-size:21px;font-weight:800;margin:10px 0 28px}.meta{color:#94a3b8;font-size:13px;line-height:1.8}.certno{margin-top:25px;font-size:12px;color:#94a3b8}.status{padding:16px;border-radius:12px;background:#172033;color:#cbd5e1;white-space:pre-wrap}.hidden{display:none}
@media print{body{background:#fff;color:#111;padding:0}.top,.status{display:none!important}.card{box-shadow:none;border:2px solid #222;color:#111;min-height:90vh;display:flex;flex-direction:column;justify-content:center}.name{color:#111}.meta{color:#333}.eyebrow{color:#111}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="logo" href="./index.html">NextGen <span>DevSecOps AI</span></a><div class="actions"><a class="btn" href="./index.html#certificate">← Back</a><button class="btn primary" onclick="window.print()">Print Certificate</button></div></div>
  <div id="status" class="status">Loading certificate…</div>
  <div id="certificate" class="card hidden">
    <div class="eyebrow">NEXTGEN DEVSECOPS AI</div>
    <div class="title">Certificate of Completion</div>
    <div class="meta">This certificate is presented to</div>
    <div id="studentName" class="name">Student</div>
    <div class="meta">for successfully completing</div>
    <div id="courseName" class="course">Training Program</div>
    <div class="meta">Issued on <span id="issuedDate">—</span></div>
    <div id="certNo" class="certno"></div>
    <div class="meta" style="margin-top:35px">NextGen DevSecOps AI • Learn • Build • Secure • Innovate</div>
  </div>
</div>
<script>
(async()=>{
 const URL='https://hkpvigvtdckxhmnsvdrh.supabase.co',KEY='sb_publishable_JlIrNdsEXgjikrh9F_YxYg_DBrgimoQ';
 const sb=supabase.createClient(URL,KEY), status=document.getElementById('status');
 try{
   const {data:{session},error:se}=await sb.auth.getSession(); if(se)throw se;
   if(!session){location.replace('login.html');return;}
   const {data:{user},error:ue}=await sb.auth.getUser(); if(ue||!user)throw ue||new Error('Authentication required.');
   const id=new URLSearchParams(location.search).get('id'); if(!id)throw new Error('Certificate ID is missing.');
   const {data:c,error}=await sb.from('certificates').select('id,student_id,course_id,certificate_number,issued_at,courses(name)').eq('id',id).eq('student_id',user.id).maybeSingle();
   if(error)throw error; if(!c)throw new Error('Certificate not found or you do not have access to it.');
   document.getElementById('studentName').textContent=user.user_metadata?.full_name||user.email||'Student';
   document.getElementById('courseName').textContent=c.courses?.name||'Training Program';
   document.getElementById('issuedDate').textContent=c.issued_at?new Date(c.issued_at).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'}):'—';
   document.getElementById('certNo').textContent=c.certificate_number?'Certificate ID: '+c.certificate_number:'';
   status.classList.add('hidden'); document.getElementById('certificate').classList.remove('hidden');
 }catch(e){status.textContent=e.message||'Unable to load certificate.';}
})();
</script>
</body>
</html>

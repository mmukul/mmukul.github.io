<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Password Reset | NextGen DevSecOps AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script src="js/supabase-config.js?v=26"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070a12;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.box{width:min(460px,calc(100% - 32px));background:#0e1321;border:1px solid #26304a;border-radius:20px;padding:30px;box-shadow:0 25px 80px rgba(0,0,0,.45)}.brand{font-weight:900;color:#bdb5ff}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;color:#65e6ff}.box h1{font-size:30px;margin:10px 0 8px}.sub{color:#9aa5b8;font-size:13px;line-height:1.55;margin:0 0 20px}label{display:block;color:#cbd5e1;font-size:12px;font-weight:800;margin:13px 0 6px}input{width:100%;padding:12px 13px;border:1px solid #303a54;background:#090e19;color:#fff;border-radius:9px;outline:none}input:focus{border-color:#8b5cf6}button{width:100%;display:inline-flex;justify-content:center;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid #4f46e5;background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff;font-weight:900;cursor:pointer;text-decoration:none;margin-top:18px}button:disabled{opacity:.6;cursor:not-allowed}.captcha{margin-top:14px;min-height:65px}.msg{min-height:20px;margin-top:12px;font-size:12px;color:#fbbf24;line-height:1.5}.success{color:#86efac}.hidden{display:none!important}.back{display:block;text-align:center;color:#94a3b8;font-size:12px;text-decoration:none;margin-top:18px}.back:hover{color:#fff}.hint{font-size:12px;color:#94a3b8;line-height:1.5;margin-top:12px}</style>
</head>
<body><main class="box">
<div class="brand">NextGen DevSecOps AI</div><div class="eyebrow">STUDENT PORTAL</div>
<section id="requestView">
<h1>Reset your password</h1>
<p class="sub">Enter your student account email. We will send a secure password-reset link.</p>
<form id="requestForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<div id="turnstile" class="captcha"></div><button id="requestBtn" type="submit" disabled>Send reset link →</button><div id="requestMsg" class="msg" role="alert"></div></form>
</section>
<section id="updateView" class="hidden">
<h1>Set a new password</h1><p class="sub">Choose a strong new password for your student account.</p>
<form id="updateForm"><label for="p">New password</label><input id="p" type="password" minlength="8" autocomplete="new-password" required>
<label for="p2">Confirm password</label><input id="p2" type="password" minlength="8" autocomplete="new-password" required>
<button id="updateBtn" type="submit">Update Password →</button><div id="updateMsg" class="msg" role="alert"></div></form>
</section>
<a class="back" href="login.html">← Back to login</a></main>
<script>
const client=window.supabase.createClient(window.NEXTGEN_SUPABASE_URL,window.NEXTGEN_SUPABASE_ANON_KEY);
const role='student';
const requestView=document.getElementById('requestView'),updateView=document.getElementById('updateView');
const requestForm=document.getElementById('requestForm'),requestBtn=document.getElementById('requestBtn'),requestMsg=document.getElementById('requestMsg');
const updateForm=document.getElementById('updateForm'),updateBtn=document.getElementById('updateBtn'),updateMsg=document.getElementById('updateMsg');
let captchaToken='',turnstileWidgetId=null,recoveryMode=false;
window.onTurnstileSuccess=(token)=>{captchaToken=String(token||'');requestBtn.disabled=false;};
window.onTurnstileExpired=()=>{captchaToken='';};
window.onTurnstileError=()=>{captchaToken='';requestMsg.textContent='Security check could not be completed. Please retry.';};
function renderCaptcha(){
  if(!window.NEXTGEN_TURNSTILE_SITE_KEY){requestMsg.textContent='Security configuration is incomplete: Turnstile site key is not configured.';requestBtn.disabled=true;return;}
  if(window.turnstile){
    if(turnstileWidgetId!==null) return;
    requestBtn.disabled=true;
    turnstileWidgetId=window.turnstile.render('#turnstile',{
      sitekey:window.NEXTGEN_TURNSTILE_SITE_KEY,
      action:'password_reset',
      callback:(token)=>{captchaToken=String(token||'');requestBtn.disabled=false;},
      'expired-callback':()=>{captchaToken='';requestBtn.disabled=true;},
      'error-callback':()=>{captchaToken='';requestBtn.disabled=true;requestMsg.textContent='Security check could not be completed. Please retry.';}
    });
  } else setTimeout(renderCaptcha,250);
}
function showUpdate(){recoveryMode=true;requestView.classList.add('hidden');updateView.classList.remove('hidden');}
async function getRecoverySession(){
  const {data:{session},error}=await client.auth.getSession();
  if(error) throw error;
  if(!session) throw new Error('This password-reset link is invalid or has expired. Please request a new one.');
  return session;
}
async function validateRecoverySession(){
  const session=await getRecoverySession();
  const {data:{user},error}=await client.auth.getUser();
  if(error||!user) throw new Error('This password-reset link is invalid or has expired. Please request a new one.');
  // The recovery session itself is the authorization boundary. The portal role is
  // used only for UX/routing and is not relied upon as a security boundary.
  const {data:profile,error:pe}=await client.from('profiles').select('role,status').eq('id',user.id).maybeSingle();
  if(pe) throw pe;
  if(!profile||profile.status!=='active') throw new Error('This account is not active. Please contact the administrator.');
  if(profile.role!=='student') throw new Error('Please use the password-reset link for your student account.');
  return {session,user,profile};
}
async function enterRecoveryMode(){
  try{
    await validateRecoverySession();
    showUpdate();
  }catch(e){
    requestView.classList.add('hidden');
    updateView.classList.remove('hidden');
    updateBtn.disabled=true;
    updateMsg.textContent=e.message||'Invalid password-reset session.';
  }
}
client.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'){
    setTimeout(()=>enterRecoveryMode(),0);
  }
});
(async()=>{
  const hash=location.hash||'';
  if(hash.includes('type=recovery')){
    // Supabase Auth processes the recovery URL and emits PASSWORD_RECOVERY.
    // Give the SDK a moment to establish the recovery session before validating it.
    setTimeout(()=>enterRecoveryMode(),300);
  } else {renderCaptcha();}
})();
requestForm.addEventListener('submit',async(e)=>{
 e.preventDefault();requestMsg.className='msg';requestBtn.disabled=true;requestMsg.textContent='Sending reset link…';
 try{
  if(!captchaToken && window.turnstile && turnstileWidgetId!==null){
   try{captchaToken=String(window.turnstile.getResponse(turnstileWidgetId)||'');}catch(_e){}
  }
  if(!captchaToken) throw new Error('Complete the security check before requesting a reset link.');
  const email=document.getElementById('email').value.trim().toLowerCase();
  const redirectTo=new URL('reset-password.html',location.href).href;
  const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo,captchaToken});
  if(error) throw error;
  requestMsg.className='msg success';requestMsg.textContent='If an account exists for this email, a password-reset link has been sent.';
  captchaToken='';if(window.turnstile){try{window.turnstile.reset(turnstileWidgetId);}catch(_e){}}
 }catch(err){requestMsg.textContent=err.message||'Unable to send reset link.';captchaToken='';if(window.turnstile){try{window.turnstile.reset(turnstileWidgetId);}catch(_e){}}}
 finally{requestBtn.disabled=false;}
});
updateForm.addEventListener('submit',async(e)=>{
 e.preventDefault();updateMsg.className='msg';updateBtn.disabled=true;
 try{
  const p=document.getElementById('p').value,p2=document.getElementById('p2').value;
  if(p.length<8) throw new Error('Password must be at least 8 characters.');
  if(p!==p2) throw new Error('Passwords do not match.');
  await validateRecoverySession();
  const {error}=await client.auth.updateUser({password:p});
  if(error) throw error;
  updateMsg.className='msg success';updateMsg.textContent='Password updated successfully. Redirecting to login…';
  await client.auth.signOut();setTimeout(()=>location.replace('login.html'),1000);
 }catch(err){updateMsg.textContent=err.message||'Unable to update password.';updateBtn.disabled=false;}
});
</script></body></html>

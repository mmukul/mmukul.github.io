<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password | NextGen DevSecOps AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070914;color:#fff;font:14px Inter,system-ui,sans-serif;padding:14px}.box{width:min(420px,100%);background:#101525;border:1px solid #29344d;border-radius:18px;padding:22px;box-shadow:0 22px 65px #0008}.brand{font-weight:900;color:#67e8f9}.eyebrow{font-size:10px;letter-spacing:.14em;color:#94a3b8;margin-top:3px}h1{font-size:25px;margin:9px 0 6px}.sub{color:#9aa5b8;line-height:1.45;margin:0 0 16px;font-size:13px}label{display:block;font-size:12px;font-weight:800;color:#dbeafe;margin:11px 0 6px}input{width:100%;height:42px;border:1px solid #334155;border-radius:9px;background:#090e19;color:#fff;padding:9px 11px;outline:none}input:focus{border-color:#818cf8;box-shadow:0 0 0 3px #6366f11f}button{width:100%;height:42px;margin-top:13px;border:1px solid #818cf8;border-radius:9px;background:linear-gradient(135deg,#4f46e5,#0891b2);color:#fff;font-weight:900;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.back{display:block;text-align:center;color:#94a3b8;text-decoration:none;font-size:12px;margin-top:15px}.msg{min-height:20px;margin-top:10px;font-size:12px;line-height:1.45}.ok{color:#86efac}.err{color:#fca5a5}.captcha-wrap{margin-top:11px;padding:6px 8px;border:1px solid rgba(103,232,249,.14);border-radius:10px;background:rgba(8,145,178,.04)}.captcha-label{display:block;color:#67e8f9;font-size:9px;font-weight:900;letter-spacing:.12em;margin-bottom:3px}.captcha{min-height:65px;display:flex;align-items:flex-start;overflow:hidden}.captcha iframe{max-width:100%}
</style></head><body><main class="box"><div class="brand">NextGen DevSecOps AI</div><div class="eyebrow">STUDENT PORTAL</div><h1>Forgot Password?</h1><p class="sub">Enter your registered student email. If the account exists, we’ll send a secure reset link.</p><form id="form"><label for="email">Email</label><input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required placeholder="you@example.com"><div class="captcha-wrap"><span class="captcha-label">SECURITY CHECK</span><div id="turnstile" class="captcha"></div></div><button id="submit" type="submit" disabled>Send Reset Link</button><div id="msg" class="msg" role="status" aria-live="polite"></div></form><a class="back" href="login.html">← Back to Student Login</a></main>
<script>
(() => {
  'use strict';
  // Self-contained production configuration. Do not add a service-role key here.
  const SUPABASE_URL='https://hkpvigvtdckxhmnsvdrg.supabase.co';
  const SUPABASE_ANON_KEY='sb_publishable_JlIrNdsEXgjikrh9F_YxYg_DBrgimoQ';
  const TURNSTILE_SITE_KEY='0x4AAAAAAFB-n4TRFrZBKY3q';
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const form=document.getElementById('form'),btn=document.getElementById('submit'),msg=document.getElementById('msg'),emailEl=document.getElementById('email');
  let captchaToken='',captchaWidget=null,attempts=0;
  function show(t,c=''){msg.textContent=t;msg.className='msg '+c;}
  function updateButton(){btn.disabled=!captchaToken||!emailEl.checkValidity();}
  function resetCaptcha(){captchaToken='';updateButton();try{if(window.turnstile&&captchaWidget!==null)window.turnstile.reset(captchaWidget);}catch(_){} }
  function captchaError(code){resetCaptcha();const c=String(code||'');if(c==='110200')show('Security check is not authorized for this domain. Verify the Turnstile hostname settings.','err');else if(c==='110100'||c==='110110')show('Security check configuration is invalid. Verify the Turnstile site key.','err');else show('Security check could not be completed. Please refresh and try again.','err');}
  function renderCaptcha(){
    if(captchaWidget!==null||!window.turnstile)return;
    try{captchaWidget=window.turnstile.render('#turnstile',{sitekey:TURNSTILE_SITE_KEY,theme:'auto',size:'flexible',action:'student_password_reset',retry:'auto',refreshExpired:'auto',callback:(token)=>{captchaToken=String(token||'').trim();updateButton();show('Security check verified ✓','ok');},'expired-callback':()=>{resetCaptcha();show('Security check expired. Please complete it again.','err');},'error-callback':captchaError});}
    catch(e){captchaWidget=null;if(attempts++<10)setTimeout(renderCaptcha,500);else captchaError('');}
  }
  function waitForCaptcha(){if(window.turnstile){if(typeof window.turnstile.ready==='function')window.turnstile.ready(renderCaptcha);else renderCaptcha();}else if(attempts++<30)setTimeout(waitForCaptcha,300);else captchaError('');}
  emailEl.addEventListener('input',updateButton);waitForCaptcha();
  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const email=emailEl.value.trim().toLowerCase();
    if(!email||!emailEl.checkValidity()||!captchaToken){show('Please enter a valid email and complete the security check.','err');return;}
    btn.disabled=true;show('Sending reset link…');
    try{
      // Call Supabase Auth's documented recovery endpoint directly. Send the
      // publishable/anon key in `apikey` (not as a Bearer JWT), and use the
      // API's snake_case fields including captcha_token.
      const redirectTo=new URL('update-password.html',window.location.href).href;
      const response=await fetch(SUPABASE_URL+'/auth/v1/recover',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},
        body:JSON.stringify({email,redirect_to:redirectTo,captcha_token:captchaToken}),
        mode:'cors',
        cache:'no-store'
      });
      const responseText=await response.text();
      let payload={};
      try{payload=responseText?JSON.parse(responseText):{};}catch(_){payload={message:responseText};}
      if(!response.ok){
        const message=String(payload.msg||payload.message||payload.error_description||payload.error||('Supabase Auth returned HTTP '+response.status));
        const error=new Error(message);error.status=response.status;throw error;
      }
      form.reset();
      resetCaptcha();
      show('If this email is registered, the reset link has been sent. Check your inbox and open the link on this device.','ok');
    }catch(err){
      resetCaptcha();
      const detail=String(err?.message||'').trim();
      if(err?.name==='AbortError')show('The password reset request timed out. Please try again.','err');
      else if(/captcha/i.test(detail))show('Security verification failed. Complete the CAPTCHA again and retry.','err');
      else if(/invalid redirect|redirect.*not allowed|redirect_to/i.test(detail))show('The password reset redirect URL is not allowed in Supabase Auth settings. Add https://nextgendevsecops.in/student-portal/update-password.html to the allowed redirect URLs.','err');
      else if(/captcha|challenge/i.test(detail))show('Supabase rejected the security token. Confirm the Turnstile secret in Supabase Bot and Abuse Protection matches this site key, then retry with a fresh CAPTCHA.','err');
      else if(err instanceof TypeError && /fetch/i.test(detail))show('The browser could not reach Supabase Auth. Check the Network tab for /auth/v1/recover; if no HTTP status appears, check browser extensions, VPN, DNS, and CORS/network blocking.','err');
      else show((err.status?'Supabase Auth HTTP '+err.status+': ':'')+(detail||'Unable to send the reset link. Please try again.'),'err');
    }finally{updateButton();}
  });
})();
</script></body></html>

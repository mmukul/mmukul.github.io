<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password | NextGen DevSecOps AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js?v=93"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070914;color:#fff;font:14px Inter,system-ui,sans-serif;padding:14px}.box{width:min(420px,100%);background:#101525;border:1px solid #29344d;border-radius:18px;padding:22px;box-shadow:0 22px 65px #0008}.brand{font-weight:900;color:#67e8f9}.eyebrow{font-size:10px;letter-spacing:.14em;color:#94a3b8;margin-top:3px}h1{font-size:25px;margin:9px 0 6px}.sub{color:#9aa5b8;line-height:1.45;margin:0 0 16px;font-size:13px}label{display:block;font-size:12px;font-weight:800;color:#dbeafe;margin:11px 0 6px}input{width:100%;height:42px;border:1px solid #334155;border-radius:9px;background:#090e19;color:#fff;padding:9px 11px;outline:none}input:focus{border-color:#818cf8;box-shadow:0 0 0 3px #6366f11f}button{width:100%;height:42px;margin-top:13px;border:1px solid #818cf8;border-radius:9px;background:linear-gradient(135deg,#4f46e5,#0891b2);color:#fff;font-weight:900;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.back{display:block;text-align:center;color:#94a3b8;text-decoration:none;font-size:12px;margin-top:15px}.msg{min-height:20px;margin-top:10px;font-size:12px;line-height:1.45}.ok{color:#86efac}.err{color:#fca5a5}
</style></head><body><main class="box"><div class="brand">NextGen DevSecOps AI</div><div class="eyebrow">STUDENT PORTAL</div><h1>Forgot Password?</h1><p class="sub">Enter your registered student email. If the account exists, we’ll send a secure reset link.</p><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><button id="submit" type="submit">Send Reset Link</button><div id="msg" class="msg" role="status" aria-live="polite"></div></form><a class="back" href="login.html">← Back to Student Login</a></main>
<script>
const client=window.supabase.createClient(window.NEXTGEN_SUPABASE_URL,window.NEXTGEN_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('form'),btn=document.getElementById('submit'),msg=document.getElementById('msg');
function show(t,c=''){msg.textContent=t;msg.className='msg '+c;}
form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase();if(!email)return;btn.disabled=true;show('Sending reset link…');try{const redirectTo=new URL('./update-password.html',location.href).href;const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo});if(error)throw error;form.reset();show('If this email is registered, the reset link has been sent. Check your inbox and open the link on this device.','ok');}catch(err){show(err?.message||'Unable to send the reset link. Please try again.','err');}finally{btn.disabled=false;} });
</script></body></html>

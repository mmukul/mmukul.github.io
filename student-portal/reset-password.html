<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | NextGen DevSecOps AI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070914;color:#e5e7eb;font:14px Inter,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,calc(100% - 28px));background:#101525;border:1px solid #27324a;border-radius:18px;padding:24px;box-sizing:border-box;box-shadow:0 20px 60px #0006}.brand{font-weight:800;color:#67e8f9;margin-bottom:8px}.eyebrow{font-size:11px;color:#94a3b8;letter-spacing:.12em}h1{font-size:26px;margin:8px 0}.sub{color:#94a3b8;line-height:1.5}label{display:block;font-size:12px;margin:14px 0 6px;color:#cbd5e1}input{width:100%;box-sizing:border-box;background:#0b1020;color:#fff;border:1px solid #334155;border-radius:10px;padding:12px}button{width:100%;margin-top:16px;border:0;border-radius:10px;padding:12px;font-weight:700;background:linear-gradient(135deg,#06b6d4,#6366f1);color:#fff;cursor:pointer}.back{display:block;text-align:center;margin-top:16px;color:#94a3b8;text-decoration:none;font-size:12px}.msg{margin-top:12px;min-height:20px;line-height:1.5}.ok{color:#86efac}.err{color:#fca5a5}.hidden{display:none}</style></head><body><main class="box"><div class="brand">NextGen DevSecOps AI</div><div class="eyebrow">STUDENT PORTAL</div><h1 id="title">Forgot Password?</h1><p class="sub" id="sub">Enter your registered email address and we’ll send you a secure password-reset link.</p><form id="requestForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><button type="submit">Send Reset Link</button></form><form id="updateForm" class="hidden"><label for="password">New Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirm Password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Update Password</button></form><div id="msg" class="msg" role="alert"></div><a class="back" href="login.html">← Back to Student Login</a></main><script>const SUPABASE_URL='https://hkpvigvtdckxhmnsvdrh2.supabase.co',SUPABASE_KEY='sb_publishable_JlIrNdsEXgjikrh9F_YxYg_DBrgimoQ';const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const rf=document.getElementById('requestForm'),uf=document.getElementById('updateForm'),msg=document.getElementById('msg'),title=document.getElementById('title'),sub=document.getElementById('sub');function setMsg(t,c){msg.textContent=t;msg.className='msg '+(c||'')}function showUpdate(){rf.classList.add('hidden');uf.classList.remove('hidden');title.textContent='Set New Password';sub.textContent='Choose a new password for your student account.'}client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session?.user&&location.hash.includes('access_token'))showUpdate()});client.auth.getSession().then(({data})=>{if(data.session&&location.hash.includes('access_token'))showUpdate()});rf.addEventListener('submit',async e=>{e.preventDefault();setMsg('Sending reset link…');const email=document.getElementById('email').value.trim().toLowerCase();try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:new URL('./reset-password.html',location.href).href});if(error)throw error;setMsg('If this email is registered, a password-reset link has been sent. Please check your inbox.','ok');rf.reset()}catch(err){setMsg(err.message||'Unable to send the reset link. Please try again.','err')}});uf.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8)return setMsg('Password must be at least 8 characters.','err');if(p!==c)return setMsg('Passwords do not match.','err');setMsg('Updating password…');try{const {error}=await client.auth.updateUser({password:p});if(error)throw error;setMsg('Password updated successfully. You can now sign in.','ok');uf.reset();setTimeout(()=>location.replace('login.html'),1200)}catch(err){setMsg(err.message||'Unable to update the password. Please restart the reset link.','err')}});</script></body></html>

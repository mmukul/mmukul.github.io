  window.NEXTGEN_TURNSTILE_SITE_KEY || '0x4AAAAAAFB-n4TRFrZBKY3q';

</head><body><main class="box"><div class="brand">NextGen DevSecOps AI</div><div class="eyebrow">STUDENT PORTAL</div><h1>Student Login</h1>
<p class="sub">Sign in with your Supabase account to continue.</p>
<form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<div id="turnstile" class="captcha"></div>
<button id="submit" type="submit">Sign in →</button><a class="back" href="reset-password.html" style="margin-top:12px">Forgot password?</a><div id="msg" class="msg" role="alert"></div></form>
<a class="back" href="../">← Back to website</a></main>
<script>
const client=window.supabase.createClient(window.NEXTGEN_SUPABASE_URL,window.NEXTGEN_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('loginForm'),msg=document.getElementById('msg'),btn=document.getElementById('submit');
let captchaToken='';
let turnstileWidgetId=null;
let captchaRendering=false;
let captchaReady=false;
let turnstileLoadFailed=false;

function setLoginMessage(text){msg.textContent=String(text||'');}

function turnstileErrorMessage(code){
  const c=String(code||'');
  if(c==='110200'||c==='400021'){
    const host=String(location.hostname||'').toLowerCase();
    return `Security check is not authorized for "${host}". In Cloudflare Turnstile Hostname Management, authorize this exact hostname (and any other production hostname used for the portal).`;
  }
  if(c==='110100'||c==='110110'||c==='400020')
    return 'Security check configuration is invalid. Verify the production Turnstile site key in Cloudflare.';
  if(c==='400070')
    return 'Security check is disabled. Enable the production Turnstile widget in Cloudflare.';
  if(c==='200500')
    return 'Security check could not load. Please allow challenges.cloudflare.com and refresh the page.';
  if(c==='110600'||c==='110620')
    return 'Security check timed out. Please retry.';
  if(c==='200100')
    return 'Security check could not validate because of a clock or cache issue. Check your device time and refresh.';
  return 'Security check could not be completed. Please refresh and try again.';
}

window.onTurnstileSuccess=(token)=>{
  captchaToken=String(token||'');
  captchaReady=Boolean(captchaToken);
  if(captchaReady) setLoginMessage('Security check verified ✓');
  btn.disabled=!captchaReady;
};
window.onTurnstileExpired=()=>{
  captchaToken=''; captchaReady=false; btn.disabled=true;
  setLoginMessage('Security check expired. Please complete it again.');
};
window.onTurnstileError=(code)=>{
  captchaToken=''; captchaReady=false; btn.disabled=true;
  setLoginMessage(turnstileErrorMessage(code));
  console.warn('[NextGen] Turnstile error:',code);
  return true;
};
window.onTurnstileTimeout=()=>{
  captchaToken=''; captchaReady=false; btn.disabled=true;
  setLoginMessage('Security check timed out. Please retry.');
};

function nextgenTurnstileLoaded(){
  window.__nextgenTurnstileReady=true;
  window.__nextgenTurnstileScriptLoaded=true;
  document.dispatchEvent(new Event('nextgen-turnstile-ready'));
  renderCaptcha();
}
window.nextgenTurnstileLoaded=nextgenTurnstileLoaded;

function waitForTurnstile(callback,attempt=0){
  if(window.turnstile && typeof window.turnstile.render==='function') return callback(true);
  if(window.__nextgenTurnstileScriptError || turnstileLoadFailed || attempt>=40) return callback(false);
  setTimeout(()=>waitForTurnstile(callback,attempt+1),250);
}

function renderCaptcha(){
  if(captchaRendering || turnstileWidgetId!==null) return;
  if(!window.NEXTGEN_TURNSTILE_SITE_KEY){
    btn.disabled=true;
    setLoginMessage('Security configuration is incomplete: Turnstile site key is not configured.');
    return;
  }
  waitForTurnstile((ready)=>{
    if(!ready){
      turnstileLoadFailed=true; btn.disabled=true;
      setLoginMessage('Security check could not load. Please allow challenges.cloudflare.com and refresh the page.');
      return;
    }
    if(captchaRendering || turnstileWidgetId!==null) return;
    captchaRendering=true;
    try{
      turnstileWidgetId=window.turnstile.render('#turnstile',{
        sitekey:String(window.NEXTGEN_TURNSTILE_SITE_KEY).trim(),
        theme:'auto',
        size:'flexible',
        retry:'auto',
        'retry-interval':8000,
        'refresh-expired':'auto',
        'refresh-timeout':'auto',
        action:'student_login',
        callback:window.onTurnstileSuccess,
        'expired-callback':window.onTurnstileExpired,
        'timeout-callback':window.onTurnstileTimeout,
        'error-callback':window.onTurnstileError
      });
      captchaRendering=false;
      btn.disabled=true;
    }catch(err){
      captchaRendering=false; btn.disabled=true;
      console.error('[NextGen] Turnstile render failed:',err);
      setLoginMessage('Security check could not be loaded. Please refresh and retry.');
    }
  });
}

btn.disabled=true;
if(!window.NEXTGEN_TURNSTILE_SITE_KEY){
  setLoginMessage('Security configuration is incomplete: production Turnstile site key is missing.');
}
document.addEventListener('nextgen-turnstile-ready',renderCaptcha);
document.addEventListener('nextgen-turnstile-error',()=>{
  turnstileLoadFailed=true; btn.disabled=true;
  setLoginMessage('Security check could not load. Please allow challenges.cloudflare.com and refresh the page.');
});
if(window.turnstile) renderCaptcha();
else setTimeout(renderCaptcha,50);

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  btn.disabled=true;
  setLoginMessage('Signing in…');
  try{
    const token=captchaToken || (window.turnstile && turnstileWidgetId!==null ? turnstile.getResponse(turnstileWidgetId) : '');
    if(!token) throw new Error('Complete the security check before signing in.');
    const email=document.getElementById('email').value.trim().toLowerCase();
    const password=document.getElementById('password').value;
    const loginUrl=`${window.NEXTGEN_SUPABASE_URL.replace(/\/$/,'')}/functions/v1/secure-login`;
    const response=await fetch(loginUrl,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':window.NEXTGEN_SUPABASE_ANON_KEY,
        'Authorization':`Bearer ${window.NEXTGEN_SUPABASE_ANON_KEY}`,
        'Accept':'application/json'
      },
      body:JSON.stringify({email,password,turnstile_token:token})
    });
    const authData=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(authData.error||authData.error_description||authData.message||`Unable to sign in (HTTP ${response.status}).`);
    if(!authData.access_token||!authData.refresh_token) throw new Error('Authentication failed.');
    const {data,error}=await client.auth.setSession({access_token:authData.access_token,refresh_token:authData.refresh_token});
    if(error) throw error;
    if(!data.user) throw new Error('Authentication failed.');
    const {data:profile,error:pe}=await client.from('profiles').select('role,status').eq('id',data.user.id).maybeSingle();
    if(pe) throw pe;
    if(!profile||profile.role!=='student'||profile.status!=='active'){
      await client.auth.signOut();
      throw new Error('This account is not an active student account.');
    }
    location.replace('index.html');
  }catch(err){
    setLoginMessage(err.message||'Unable to sign in.');
    btn.disabled=true;
    captchaToken=''; captchaReady=false;
    if(window.turnstile && turnstileWidgetId!==null){
      try{ window.turnstile.reset(turnstileWidgetId); }catch(_ ){}
    }
  }
});
</script></body></html>

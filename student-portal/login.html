<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Student Login | NextGen DevSecOps AI</title>
  <meta name="description" content="Secure student login for NextGen DevSecOps AI courses, labs and learning resources.">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer onerror="window.__turnstileScriptFailed=true"></script>
  <script src="js/supabase-config.js?v=294" defer></script>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#111d31;--line:#2b3d57;--cyan:#67e8f9;--blue:#2563eb;--muted:#b7c5d8;--white:#f8fafc;--red:#fecaca;--green:#bbf7d0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 12% 8%,rgba(8,145,178,.17),transparent 36%),radial-gradient(ellipse at 88% 90%,rgba(79,70,229,.19),transparent 38%),linear-gradient(145deg,#0b1220,#111a2d 55%,#10182b);color:var(--white);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .shell{width:min(100%,440px)}.brand{font-size:14px;font-weight:900;letter-spacing:.01em;color:var(--cyan)}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;color:#9fb0c7;margin-top:4px}h1{font-size:clamp(25px,7vw,31px);line-height:1.12;margin:10px 0 8px;letter-spacing:-.03em}.intro{margin:0 0 19px;color:var(--muted);font-size:13px}
    .card{padding:clamp(18px,5vw,25px);border:1px solid rgba(148,163,184,.25);border-radius:20px;background:linear-gradient(145deg,rgba(20,33,54,.97),rgba(13,22,39,.98));box-shadow:0 24px 70px rgba(0,0,0,.3)}label{display:block;margin:13px 0 6px;color:#e2e8f0;font-size:12px;font-weight:800}input{display:block;width:100%;height:45px;border:1px solid #3a4c66;border-radius:10px;padding:10px 12px;background:#0a1322;color:#fff;font:inherit;outline:none}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(103,232,249,.12)}input::placeholder{color:#71839c}.password-wrap{position:relative}.password-wrap input{padding-right:72px}.toggle{position:absolute;right:7px;top:7px;height:31px;padding:0 9px;border:1px solid #3a4c66;border-radius:7px;background:#17253a;color:#dbeafe;font-size:11px;font-weight:800;cursor:pointer}
    .captcha-box{margin-top:14px;padding:9px;border:1px solid rgba(103,232,249,.17);border-radius:11px;background:rgba(8,145,178,.045)}.captcha-title{font-size:9px;font-weight:900;letter-spacing:.14em;color:var(--cyan);margin-bottom:6px}.captcha-slot{min-height:65px;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}.captcha-help{font-size:10px;color:#9fb0c7;margin:4px 0 0}.captcha-retry{margin-top:7px;padding:6px 10px;border:1px solid #31558a;border-radius:8px;background:#142b4d;color:#bfdbfe;font-size:10px;font-weight:800;cursor:pointer}.captcha-retry:hover,.captcha-retry:focus-visible{background:#1d4ed8;color:#fff;outline:2px solid #60a5fa;outline-offset:2px}
    .submit{width:100%;min-height:46px;margin-top:15px;border:1px solid rgba(103,232,249,.35);border-radius:11px;background:linear-gradient(110deg,#1d4ed8,#0e7490);color:#fff;font-weight:900;letter-spacing:.01em;cursor:pointer}.submit:disabled{opacity:.56;cursor:wait}.message{min-height:20px;margin-top:11px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.message.error{color:var(--red)}.message.success{color:var(--green)}.message.info{color:#bae6fd}.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:11px}.links a,.back{color:#a5f3fc;text-decoration:none}.links a:hover,.back:hover{text-decoration:underline}.back{display:block;text-align:center;margin-top:18px;font-size:12px;color:#cbd5e1}.footer{margin-top:14px;text-align:center;color:#8ea0b8;font-size:10px}.diagnostic{margin-top:10px;color:#9fb0c7;font-size:10px;line-height:1.5}
    @media(max-width:360px){body{padding:10px}.card{padding:16px}.captcha-box{padding:7px}.links{flex-direction:column;gap:8px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  
    .brand-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 13px}
    .brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#2563eb,#0e7490);color:#fff;box-shadow:0 7px 18px rgba(37,99,235,.18)}
    .brand-mark svg{width:20px;height:20px}.brand{font-size:14px;font-weight:850;letter-spacing:-.02em;color:#f8fafc}
    .diagnostic{margin-top:10px;padding:9px 10px;border:1px solid #2b3d57;border-radius:9px;background:#0a1322;color:#9fb0c7;font-size:10px;line-height:1.5;overflow-wrap:anywhere}
    .links a{color:#a5f3fc}.captcha-help{color:#9fb0c7}
</style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <div class="brand-row"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19 6v5c0 4.5-2.9 7.8-7 10-4.1-2.2-7-5.5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg></div><div class="brand">NextGen DevSecOps AI</div></div><div class="eyebrow">SECURE STUDENT PORTAL</div>
      <h1 id="title">Student Portal</h1>
      <p class="intro">Sign in to access your enrolled courses, hands-on labs, class recordings and learning resources.</p>
      <form id="loginForm" novalidate>
        <label for="email">Student email</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="Enter your password" required><button class="toggle" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">Show</button></div>
        <div class="captcha-box"><div class="captcha-title">SECURITY CHECK</div><div id="turnstile" class="captcha-slot" aria-label="Cloudflare security verification"></div><p class="captcha-help">Complete the verification before signing in.</p><button class="captcha-retry" id="captchaRetry" type="button">Reload security check</button></div>
        <button class="submit" id="submit" type="submit" disabled>Sign in securely</button>
        <div class="message" id="message" role="status" aria-live="polite"></div>
      </form>
      <div class="links"><a href="reset-password.html">Forgot password?</a></div>
      <div class="diagnostic" id="diagnostic" hidden></div>
    </section>

  </main>
<script>
(function(){
  'use strict';
  const form=document.getElementById('loginForm'),retryCaptcha=document.getElementById('captchaRetry'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),submit=document.getElementById('submit'),message=document.getElementById('message'),diagnostic=document.getElementById('diagnostic'),toggle=document.getElementById('togglePassword');
  const TURNSTILE_SITE_KEY='0x4AAAAAAFB-n4TRFrZBKY3q';
  let captchaToken='',captchaWidget=null,captchaAttempts=0,busy=false;
  function say(text,type){message.textContent=text;message.className='message '+(type||'');}
  function details(text){diagnostic.textContent=text||'';diagnostic.hidden=!text;}
  function configReady(){return !!(window.NEXTGEN_SUPABASE_URL&&window.NEXTGEN_SUPABASE_ANON_KEY&&window.NEXTGEN_SUPABASE_CONFIGURED);}
  function updateButton(){submit.disabled=busy||!emailEl.checkValidity()||!passwordEl.value||!captchaToken;}
  function clearCaptcha(){captchaToken='';updateButton();try{if(window.turnstile&&captchaWidget!==null)window.turnstile.reset(captchaWidget);}catch(_){} }
  function captchaError(code){clearCaptcha();const c=String(code||'');if(c==='110200')say('Cloudflare verification does not allow this website hostname. Check the Turnstile widget’s allowed hostnames.','error');else if(c==='110100'||c==='110110')say('Cloudflare verification is misconfigured. Check the Turnstile site key.','error');else say('Security verification could not load. Refresh the page or use another browser.','error');}
  function renderCaptcha(){if(captchaWidget!==null||!window.turnstile)return;try{captchaWidget=window.turnstile.render('#turnstile',{sitekey:TURNSTILE_SITE_KEY,theme:'dark',size:'flexible',action:'student_login',retry:'auto',refreshExpired:'auto',callback:function(token){captchaToken=String(token||'').trim();updateButton();say('Security check completed. You can sign in.','success');},'expired-callback':function(){clearCaptcha();say('Security check expired. Please complete it again.','error');},'error-callback':captchaError});}catch(e){captchaWidget=null;if(captchaAttempts++<10)setTimeout(renderCaptcha,400);else captchaError('');}}
  function waitCaptcha(){if(window.turnstile){if(window.turnstile.ready)window.turnstile.ready(renderCaptcha);else renderCaptcha();}else if(window.__turnstileScriptFailed){captchaError('script_unavailable');}else if(captchaAttempts++<40)setTimeout(waitCaptcha,300);else captchaError('script_unavailable');}
  retryCaptcha.addEventListener('click',function(){captchaToken='';if(window.turnstile&&captchaWidget!==null){try{window.turnstile.remove(captchaWidget);}catch(_){}}captchaWidget=null;captchaAttempts=0;window.__turnstileScriptFailed=false;document.getElementById('turnstile').innerHTML='';say('Reloading security verification…','info');updateButton();waitCaptcha();});
  function explainNetworkError(err){const text=String(err&&err.message||err||'');if(/failed to fetch|networkerror|load failed|fetch failed/i.test(text))return 'Unable to reach Supabase Authentication. This is usually a network, DNS, browser extension, Supabase project availability, or allowed-origin/CORS configuration issue—not an incorrect password.';return text||'Sign-in failed. Please try again.';}
  emailEl.addEventListener('input',updateButton);passwordEl.addEventListener('input',updateButton);
  toggle.addEventListener('click',function(){const show=passwordEl.type==='password';passwordEl.type=show?'text':'password';toggle.textContent=show?'Hide':'Show';toggle.setAttribute('aria-label',show?'Hide password':'Show password');toggle.setAttribute('aria-pressed',String(show));});
  waitCaptcha();
  form.addEventListener('submit',async function(e){e.preventDefault();if(busy)return;const email=emailEl.value.trim().toLowerCase(),password=passwordEl.value;if(!emailEl.checkValidity()||!password||!captchaToken){say('Enter a valid email, password, and complete the security check.','error');return;}if(!configReady()){say('Student login is not configured on this website.','error');details('Missing public Supabase URL/key. Verify student-portal/js/supabase-config.js is deployed.');return;}if(!window.supabase||typeof window.supabase.createClient!=='function'){say('The authentication library did not load.','error');details('Check access to cdn.jsdelivr.net or use the browser fallback.');return;}
    busy=true;updateButton();details('');say('Connecting securely…','info');let client;
    try{
      client=window.supabase.createClient(window.NEXTGEN_SUPABASE_URL,window.NEXTGEN_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      const {data,error}=await client.auth.signInWithPassword({email,password,options:{captchaToken}});
      if(error)throw error;if(!data||!data.user)throw new Error('Supabase did not return an authenticated user.');
      const {data:profile,error:profileError}=await client.from('profiles').select('id,full_name,role,status').eq('id',data.user.id).maybeSingle();
      if(profileError)throw new Error('Signed in, but student profile validation failed: '+profileError.message);
      if(!profile||String(profile.role||'').toLowerCase()!=='student'||String(profile.status||'').toLowerCase()!=='active'){
        await client.auth.signOut();throw new Error('This account is not an active student account. Contact the training administrator if you believe this is incorrect.');
      }
      say('Login successful. Opening your learning dashboard…','success');
      window.location.replace('index.html?v=295');
    }catch(err){
      const raw=String(err&&err.message||err||'');
      if(/captcha|turnstile|security challenge/i.test(raw)){say('Security verification was rejected. Complete the check again and retry.','error');details(raw);}
      else if(/invalid login credentials/i.test(raw)){say('Email or password is incorrect. If needed, use Forgot password.','error');}
      else if(/email not confirmed/i.test(raw)){say('Your email address is not confirmed yet. Check your inbox or contact support.','error');}
      else if(/failed to fetch|networkerror|load failed|fetch failed/i.test(raw)){say('Could not connect to the login service. Your credentials were not verified.','error');details(explainNetworkError(err)+' Check the deployed Supabase project URL/key in student-portal/js/supabase-config.js, confirm the Supabase project is active, and allow https://nextgendevsecops.in in Supabase Auth URL settings.');}
      else{say(raw||'Unable to sign in. Please retry.','error');}
      clearCaptcha();
    }finally{busy=false;updateButton();}
  });
})();
</script>
</body>
</html>

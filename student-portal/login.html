<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f8ff">
  <title>Student Login | NextGen DevSecOps AI</title>
  <meta name="description" content="Secure student login for NextGen DevSecOps AI courses, labs and learning resources.">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script src="js/supabase-config.js?v=256" defer></script>
  <style>
    :root{color-scheme:light;--bg:#f6f8fc;--panel:#ffffff;--line:#e1e7f0;--blue:#365fc9;--blue-dark:#294da8;--ink:#202b3c;--muted:#657286;--soft:#f0f4fb;--red:#b42318;--green:#147d45;--cyan:#477f9b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(145deg,#f8fafc 0%,#edf2f8 52%,#f5f7fb 100%);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .shell{width:min(100%,430px)}
    .brand-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 16px}
    .brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#4269c8,#6b8bd8);color:#fff;box-shadow:0 7px 18px rgba(37,99,235,.2)}
    .brand-mark svg{width:22px;height:22px}
    .brand{font-size:15px;font-weight:850;letter-spacing:-.02em;color:#172b4d}
    .card{padding:clamp(22px,5vw,30px);border:1px solid rgba(203,216,234,.9);border-radius:22px;background:rgba(255,255,255,.96);box-shadow:0 14px 38px rgba(31,45,70,.07),0 1px 4px rgba(31,45,70,.03)}
    .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:850;letter-spacing:.13em;color:#41618d;background:#eff5ff;border:1px solid #e0eaff;border-radius:999px;padding:5px 9px}
    .eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:#16a6a1}
    h1{font-size:clamp(26px,7vw,32px);line-height:1.15;margin:15px 0 8px;letter-spacing:-.04em;color:#17243b}
    .intro{margin:0 0 22px;color:var(--muted);font-size:13px;max-width:340px}
    label{display:block;margin:14px 0 7px;color:#33445f;font-size:12px;font-weight:800}
    input{display:block;width:100%;height:46px;border:1px solid #d3deec;border-radius:11px;padding:11px 13px;background:#fbfdff;color:#15243c;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
    input:focus{border-color:#6a9cf8;background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    input::placeholder{color:#91a0b4}
    .password-wrap{position:relative}.password-wrap input{padding-right:72px}
    .toggle{position:absolute;right:7px;top:7px;height:32px;padding:0 10px;border:1px solid #dce5f1;border-radius:8px;background:#f1f6fd;color:#294b7b;font-size:11px;font-weight:800;cursor:pointer}
    .toggle:hover{background:#e7f0ff}
    .captcha-box{margin-top:17px;padding:12px;border:1px solid #e0e8f4;border-radius:13px;background:#f8fbff}
    .captcha-title{font-size:10px;font-weight:850;letter-spacing:.11em;color:#466184;margin-bottom:8px}
    .captcha-slot{min-height:65px;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}
    .captcha-help{font-size:11px;color:#71819a;margin:7px 0 0}
    .submit{width:100%;min-height:47px;margin-top:17px;border:0;border-radius:11px;background:linear-gradient(105deg,#4269c8,#5579cf);color:#fff;font-weight:850;letter-spacing:.005em;cursor:pointer;box-shadow:0 7px 16px rgba(37,99,235,.16);transition:transform .15s,box-shadow .15s,opacity .15s}
    .submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 20px rgba(37,99,235,.21)}
    .submit:focus-visible,.toggle:focus-visible,a:focus-visible{outline:3px solid rgba(37,99,235,.28);outline-offset:3px}
    .submit:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
    .message{min-height:20px;margin-top:12px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.message.error{color:var(--red)}.message.success{color:var(--green)}.message.info{color:#245ca8}
    .links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:15px;font-size:11px}
    .links a,.back{color:#245ca8;text-decoration:none;font-weight:700}.links a:hover,.back:hover{text-decoration:underline}
    .back{display:block;text-align:center;margin-top:19px;font-size:12px;color:#526783}
    .footer{margin-top:12px;text-align:center;color:#7b8aa1;font-size:10px}
    .diagnostic{margin-top:10px;padding:9px 10px;border:1px solid #e0e8f4;border-radius:9px;background:#f8fbff;color:#5f718b;font-size:10px;line-height:1.5;overflow-wrap:anywhere}
    @media(max-width:360px){body{padding:14px 10px}.card{padding:19px 16px}.captcha-box{padding:8px}.links{flex-direction:column;gap:9px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <div class="brand-row"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19 6v5c0 4.5-2.9 7.8-7 10-4.1-2.2-7-5.5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg></div><div class="brand">NextGen DevSecOps AI</div></div><div class="eyebrow">SECURE STUDENT PORTAL</div>
      <h1 id="title">Welcome back</h1>
      <p class="intro">Sign in to access your enrolled courses, hands-on labs, class recordings and learning resources.</p>
      <form id="loginForm" novalidate>
        <label for="email">Student email</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="Enter your password" required><button class="toggle" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">Show</button></div>
        <div class="captcha-box"><div class="captcha-title">SECURITY CHECK</div><div id="turnstile" class="captcha-slot" aria-label="Cloudflare security verification"></div><p class="captcha-help">Complete the verification before signing in.</p></div>
        <button class="submit" id="submit" type="submit" disabled>Sign in securely</button>
        <div class="message" id="message" role="status" aria-live="polite"></div>
      </form>
      <div class="links"><a href="reset-password.html">Forgot password?</a></div>
      <div class="diagnostic" id="diagnostic" hidden></div>
    </section>

  </main>
<script>
(function(){
  'use strict';
  const form=document.getElementById('loginForm'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),submit=document.getElementById('submit'),message=document.getElementById('message'),diagnostic=document.getElementById('diagnostic'),toggle=document.getElementById('togglePassword');
  const TURNSTILE_SITE_KEY='0x4AAAAAAFB-n4TRFrZBKY3q';
  let captchaToken='',captchaWidget=null,captchaAttempts=0,busy=false;
  function say(text,type){message.textContent=text;message.className='message '+(type||'');}
  function details(text){diagnostic.textContent=text||'';diagnostic.hidden=!text;}
  function configReady(){return !!(window.NEXTGEN_SUPABASE_URL&&window.NEXTGEN_SUPABASE_ANON_KEY&&window.NEXTGEN_SUPABASE_CONFIGURED);}
  function updateButton(){submit.disabled=busy||!emailEl.checkValidity()||!passwordEl.value||!captchaToken;}
  function clearCaptcha(){captchaToken='';updateButton();try{if(window.turnstile&&captchaWidget!==null)window.turnstile.reset(captchaWidget);}catch(_){} }
  function captchaError(code){clearCaptcha();const c=String(code||'');if(c==='110200')say('Cloudflare verification does not allow this website hostname. Check the Turnstile widget’s allowed hostnames.','error');else if(c==='110100'||c==='110110')say('Cloudflare verification is misconfigured. Check the Turnstile site key.','error');else say('Security verification could not load. Refresh the page or use another browser.','error');}
  function renderCaptcha(){if(captchaWidget!==null||!window.turnstile)return;try{captchaWidget=window.turnstile.render('#turnstile',{sitekey:TURNSTILE_SITE_KEY,theme:'light',size:'flexible',action:'student_login',retry:'auto',refreshExpired:'auto',callback:function(token){captchaToken=String(token||'').trim();updateButton();say('Security check completed. You can sign in.','success');},'expired-callback':function(){clearCaptcha();say('Security check expired. Please complete it again.','error');},'error-callback':captchaError});}catch(e){captchaWidget=null;if(captchaAttempts++<10)setTimeout(renderCaptcha,400);else captchaError('');}}
  function waitCaptcha(){if(window.turnstile){if(window.turnstile.ready)window.turnstile.ready(renderCaptcha);else renderCaptcha();}else if(captchaAttempts++<30)setTimeout(waitCaptcha,300);else captchaError('');}
  function explainNetworkError(err){const text=String(err&&err.message||err||'');if(/failed to fetch|networkerror|load failed|fetch failed/i.test(text))return 'Unable to reach Supabase Authentication. This is usually a network, DNS, browser extension, Supabase project availability, or allowed-origin/CORS configuration issue—not an incorrect password.';return text||'Sign-in failed. Please try again.';}
  emailEl.addEventListener('input',updateButton);passwordEl.addEventListener('input',updateButton);
  toggle.addEventListener('click',function(){const show=passwordEl.type==='password';passwordEl.type=show?'text':'password';toggle.textContent=show?'Hide':'Show';toggle.setAttribute('aria-label',show?'Hide password':'Show password');toggle.setAttribute('aria-pressed',String(show));});
  waitCaptcha();
  form.addEventListener('submit',async function(e){e.preventDefault();if(busy)return;const email=emailEl.value.trim().toLowerCase(),password=passwordEl.value;if(!emailEl.checkValidity()||!password||!captchaToken){say('Enter a valid email, password, and complete the security check.','error');return;}if(!configReady()){say('Student login is not configured on this website.','error');details('Missing public Supabase URL/key. Verify student-portal/js/supabase-config.js is deployed.');return;}if(!window.supabase||typeof window.supabase.createClient!=='function'){say('The authentication library did not load.','error');details('Check access to cdn.jsdelivr.net or use the browser fallback.');return;}
    busy=true;updateButton();details('');say('Connecting securely…','info');let client;
    try{
      client=window.supabase.createClient(window.NEXTGEN_SUPABASE_URL,window.NEXTGEN_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      const {data,error}=await client.auth.signInWithPassword({email,password,options:{captchaToken}});
      if(error)throw error;if(!data||!data.user)throw new Error('Supabase did not return an authenticated user.');
      const {data:profile,error:profileError}=await client.from('profiles').select('id,full_name,role,status').eq('id',data.user.id).maybeSingle();
      if(profileError)throw new Error('Signed in, but student profile validation failed: '+profileError.message);
      if(!profile||String(profile.role||'').toLowerCase()!=='student'||String(profile.status||'').toLowerCase()!=='active'){
        await client.auth.signOut();throw new Error('This account is not an active student account. Contact the training administrator if you believe this is incorrect.');
      }
      say('Login successful. Opening your learning dashboard…','success');
      window.location.replace('index.html?v=256');
    }catch(err){
      const raw=String(err&&err.message||err||'');
      if(/captcha|turnstile|security challenge/i.test(raw)){say('Security verification was rejected. Complete the check again and retry.','error');details(raw);}
      else if(/invalid login credentials/i.test(raw)){say('Email or password is incorrect. If needed, use Forgot password.','error');}
      else if(/email not confirmed/i.test(raw)){say('Your email address is not confirmed yet. Check your inbox or contact support.','error');}
      else if(/failed to fetch|networkerror|load failed|fetch failed/i.test(raw)){say('Could not connect to the login service. Your credentials were not verified.','error');details(explainNetworkError(err)+' If this repeats on multiple networks, verify the Supabase project is active and that https://nextgendevsecops.in is allowed in Supabase Auth URL settings.');}
      else{say(raw||'Unable to sign in. Please retry.','error');}
      clearCaptcha();
    }finally{busy=false;updateButton();}
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Set New Password | NextGen DevSecOps AI">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070914;color:#fff;font:14px Inter,system-ui,sans-serif;padding:14px}.box{width:min(440px,100%);background:#101525;border:1px solid #29344d;border-radius:18px;padding:24px;box-shadow:0 22px 65px #0008}.brand{font-weight:900;color:#67e8f9}.eyebrow{font-size:10px;letter-spacing:.14em;color:#94a3b8;margin-top:3px}h1{font-size:25px;margin:9px 0 6px}.sub{color:#aab5c8;line-height:1.5;margin:0 0 16px;font-size:13px}label{display:block;font-size:12px;font-weight:800;color:#dbeafe;margin:11px 0 6px}input{width:100%;height:44px;border:1px solid #40516d;border-radius:9px;background:#090e19;color:#fff;padding:9px 11px;outline:none}input:focus{border-color:#67e8f9;box-shadow:0 0 0 3px #0891b233}button{width:100%;height:44px;margin-top:15px;border:1px solid #818cf8;border-radius:9px;background:linear-gradient(135deg,#4f46e5,#0891b2);color:#fff;font-weight:900;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.msg{min-height:22px;margin-top:12px;font-size:12px;line-height:1.5}.ok{color:#86efac}.err{color:#fca5a5}.back{display:block;text-align:center;color:#a5b4cc;text-decoration:none;font-size:12px;margin-top:15px}.hidden{display:none}</style></head>
<body><main class="box"><div class="brand">NextGen DevSecOps AI</div><div class="eyebrow">STUDENT PORTAL · ACCOUNT SETUP</div><h1>Set Your Password</h1><p class="sub">Use this secure page to accept your student invitation and create your account password.</p>
<section id="otp-panel" class="hidden">
<label for="invite-email">Student email</label><input id="invite-email" type="email" autocomplete="email" required placeholder="name@example.com">
<label for="invite-code">Invitation code</label><input id="invite-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required placeholder="Enter the code from your invitation email">
<button id="verify-code" type="button">Verify Invitation Code</button>
<p class="sub">If the invitation link expired or your email security scanner opened it, use the one-time code from the invitation email instead.</p>
</section>
<form id="form" class="hidden"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="submit" type="submit">Set Password & Continue</button></form>
<div id="msg" class="msg" role="status" aria-live="polite">Verifying your invitation link…</div><a class="back" href="login.html">← Back to Student Login</a></main>
<script>
(() => {
  const SUPABASE_URL='https://hkpvigvtdckxhmnsvdrh.supabase.co';
  const SUPABASE_KEY='sb_publishable_JlIrNdsEXgjikrh9F_YxYg_DBrgimoQ';
  const form=document.getElementById('form'),p=document.getElementById('password'),c=document.getElementById('confirm'),btn=document.getElementById('submit'),msg=document.getElementById('msg');
  const otpPanel=document.getElementById('otp-panel'),emailInput=document.getElementById('invite-email'),codeInput=document.getElementById('invite-code'),verifyBtn=document.getElementById('verify-code');
  const show=(t,k='')=>{msg.textContent=t;msg.className='msg '+k};
  if(!window.supabase){show('The secure sign-in library did not load. Refresh this page and try again.','err');return;}
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:'pkce'}});
  let verified=false;
  async function establishSession(){
    const url=new URL(location.href), q=url.searchParams, hash=new URLSearchParams(url.hash.replace(/^#/,''));
    const code=q.get('code');
    const tokenHash=q.get('token_hash')||q.get('token');
    const type=q.get('type')||hash.get('type')||'invite';
    if(q.get('error_code')==='otp_expired'||q.get('error')==='access_denied'){otpPanel.classList.remove('hidden');throw new Error('This invitation link has expired or was opened by an email security scanner. Use the one-time invitation code from the email below, or ask the administrator to issue a fresh invitation.');}
    if(code){const {data,error}=await client.auth.exchangeCodeForSession(code);if(error)throw error;if(!data?.session)throw new Error('The invitation code could not be exchanged. Request a fresh invitation email.');return true;}
    if(tokenHash){const otpType=(type==='recovery'?'recovery':'invite');const {data,error}=await client.auth.verifyOtp({token_hash:tokenHash,type:otpType});if(error)throw error;if(!data?.session)throw new Error('The invitation token is invalid or expired. Request a fresh invitation email.');return true;}
    const access=hash.get('access_token'),refresh=hash.get('refresh_token');
    if(access&&refresh){const {data,error}=await client.auth.setSession({access_token:access,refresh_token:refresh});if(error)throw error;if(!data?.session)throw new Error('Could not establish your secure session. Request a fresh invitation email.');return true;}
    const {data,error}=await client.auth.getSession();if(error)throw error;return !!data?.session;
  }
  (async()=>{try{
    if(!window.supabase){throw new Error('The secure sign-in library did not load. Refresh this page and try again.');}
    verified=await establishSession();
    if(!verified){otpPanel.classList.remove('hidden');throw new Error('This link is incomplete or expired. Enter the one-time code from your invitation email below.');}
    form.classList.remove('hidden');show('Invitation verified. Create a password with at least 8 characters.','ok');
  }catch(e){show(e?.message||'Unable to verify this invitation. Request a new invitation link.','err');}})();
  verifyBtn.addEventListener('click',async()=>{const email=emailInput.value.trim().toLowerCase(),token=codeInput.value.trim();if(!email||!token){show('Enter the student email address and invitation code.','err');return;}verifyBtn.disabled=true;show('Verifying invitation code…');try{const {data,error}=await client.auth.verifyOtp({email,token,type:'invite'});if(error)throw error;if(!data?.session)throw new Error('The invitation code could not be verified. Request a fresh invitation.');verified=true;otpPanel.classList.add('hidden');form.classList.remove('hidden');show('Invitation verified. Create a password with at least 8 characters.','ok');}catch(e){show(e?.message||'The invitation code is invalid or expired.','err');}finally{verifyBtn.disabled=false;}});
  form.addEventListener('submit',async e=>{e.preventDefault();if(!verified){show('Verify your invitation link before setting a password.','err');return;}if(p.value.length<8||p.value!==c.value){show('Passwords must match and contain at least 8 characters.','err');return;}btn.disabled=true;show('Setting your password…');try{
    const {data,error}=await client.auth.updateUser({password:p.value});if(error)throw error;if(!data?.user)throw new Error('Password update was not confirmed. Please reopen your invitation link.');
    form.reset();show('Your password is set and your invitation has been accepted. You can now sign in.','ok');
    // Keep the authenticated session through the redirect so the confirmation
    // callback can complete; student login will enforce the profile status.
    setTimeout(()=>location.replace('login.html?onboarding=complete'),1400);
  }catch(err){show(err?.message||'Unable to set your password. Reopen the latest invitation email.','err');}finally{btn.disabled=false;}});
})();
</script></body></html>

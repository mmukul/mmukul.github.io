<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set New Password | NextGen DevSecOps AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js?v=93"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070914;color:#fff;font:14px Inter,system-ui,sans-serif;padding:14px}.box{width:min(420px,100%);background:#101525;border:1px solid #29344d;border-radius:18px;padding:22px;box-shadow:0 22px 65px #0008}.brand{font-weight:900;color:#67e8f9}.eyebrow{font-size:10px;letter-spacing:.14em;color:#94a3b8;margin-top:3px}h1{font-size:25px;margin:9px 0 6px}.sub{color:#9aa5b8;line-height:1.45;margin:0 0 16px;font-size:13px}label{display:block;font-size:12px;font-weight:800;color:#dbeafe;margin:11px 0 6px}input{width:100%;height:42px;border:1px solid #334155;border-radius:9px;background:#090e19;color:#fff;padding:9px 11px;outline:none}input:focus{border-color:#818cf8;box-shadow:0 0 0 3px #6366f11f}button{width:100%;height:42px;margin-top:13px;border:1px solid #818cf8;border-radius:9px;background:linear-gradient(135deg,#4f46e5,#0891b2);color:#fff;font-weight:900;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.back{display:block;text-align:center;color:#94a3b8;text-decoration:none;font-size:12px;margin-top:15px}.msg{min-height:20px;margin-top:10px;font-size:12px;line-height:1.45}.ok{color:#86efac}.err{color:#fca5a5}.hidden{display:none}
</style></head><body><main class="box"><div class="brand">NextGen DevSecOps AI</div><div class="eyebrow">STUDENT PORTAL</div><h1>Set New Password</h1><p class="sub" id="sub">Verifying your secure password-reset session…</p><form id="form" class="hidden"><label for="password">New Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirm Password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="submit" type="submit">Update Password</button></form><div id="msg" class="msg" role="status" aria-live="polite"></div><a class="back" href="login.html">← Back to Student Login</a></main>
<script>
const client=window.supabase.createClient(window.NEXTGEN_SUPABASE_URL,window.NEXTGEN_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('form'),sub=document.getElementById('sub'),btn=document.getElementById('submit'),msg=document.getElementById('msg');
function show(t,c=''){msg.textContent=t;msg.className='msg '+c;}
function showForm(){form.classList.remove('hidden');sub.textContent='Choose a new password for your student account.';}
async function init(){
 try{
  const hash=location.hash||'';
  const query=new URLSearchParams(location.search);
  if(query.get('error')) throw new Error(query.get('error_description')||'The password-reset link is invalid or expired.');
  if(hash.includes('error=')) throw new Error(new URLSearchParams(hash.slice(1)).get('error_description')||'The password-reset link is invalid or expired.');
  const {data,error}=await client.auth.getSession();
  if(error)throw error;
  if(data.session){showForm();return;}
  const {data:authData}=await new Promise(resolve=>{let done=false;const finish=v=>{if(!done){done=true;resolve(v)}};const t=setTimeout(()=>finish({data:{session:null}}),3500);client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session){clearTimeout(t);finish({data:{session}})}})});
  if(authData?.session){showForm();return;}
  throw new Error('The reset link could not be verified. Please request a new reset link.');
 }catch(err){sub.textContent='This password-reset session is not valid.';show(err?.message||'Please request a new reset link.','err');}
}
client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)showForm();});
form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8)return show('Password must be at least 8 characters.','err');if(p!==c)return show('Passwords do not match.','err');btn.disabled=true;show('Updating password…');try{const {data,error}=await client.auth.updateUser({password:p});if(error)throw error;show('Password updated successfully. Redirecting to Student Login…','ok');form.reset();await client.auth.signOut();setTimeout(()=>location.replace('login.html'),1200);}catch(err){show(err?.message||'Unable to update the password. Please request a new reset link.','err');btn.disabled=false;}});
init();
</script></body></html>

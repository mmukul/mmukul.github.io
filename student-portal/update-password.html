<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password | NextGen DevSecOps AI">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070914;color:#fff;font:14px Inter,system-ui,sans-serif;padding:14px}.box{width:min(420px,100%);background:#101525;border:1px solid #29344d;border-radius:18px;padding:22px;box-shadow:0 22px 65px #0008}.brand{font-weight:900;color:#67e8f9}.eyebrow{font-size:10px;letter-spacing:.14em;color:#94a3b8;margin-top:3px}h1{font-size:25px;margin:9px 0 6px}.sub{color:#9aa5b8;line-height:1.45;margin:0 0 16px;font-size:13px}label{display:block;font-size:12px;font-weight:800;color:#dbeafe;margin:11px 0 6px}input{width:100%;height:42px;border:1px solid #334155;border-radius:9px;background:#090e19;color:#fff;padding:9px 11px;outline:none}button{width:100%;height:42px;margin-top:13px;border:1px solid #818cf8;border-radius:9px;background:linear-gradient(135deg,#4f46e5,#0891b2);color:#fff;font-weight:900;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.msg{min-height:20px;margin-top:10px;font-size:12px;line-height:1.45}.ok{color:#86efac}.err{color:#fca5a5}.back{display:block;text-align:center;color:#94a3b8;text-decoration:none;font-size:12px;margin-top:15px}</style></head><body><main class="box"><div class="brand">NextGen DevSecOps AI</div><div class="eyebrow">STUDENT PORTAL</div><h1>Set New Password</h1><p class="sub">Create a new password for your student account.</p><form id="form"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="submit" type="submit">Update Password</button><div id="msg" class="msg" role="status" aria-live="polite"></div></form><a class="back" href="login.html">← Back to Student Login</a></main><script>
(() => {const client=window.supabase.createClient('https://hkpvigvtdckxhmnsvdrg.supabase.co','sb_publishable_JlIrNdsEXgjikrh9F_YxYg_DBrgimoQ',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const form=document.getElementById('form'),p=document.getElementById('password'),c=document.getElementById('confirm'),btn=document.getElementById('submit'),msg=document.getElementById('msg');const show=(t,k='')=>{msg.textContent=t;msg.className='msg '+k};
async function ready(){const {data}=await client.auth.getSession();if(data?.session)return true;const {data:ud}=await client.auth.getUser();return !!ud?.user;}
(async()=>{try{await ready();}catch(e){show('Open the password-reset link from your email again if the session has expired.','err');}})();
form.addEventListener('submit',async e=>{e.preventDefault();if(p.value.length<8||p.value!==c.value){show('Passwords must match and contain at least 8 characters.','err');return}btn.disabled=true;show('Updating password…');try{const {data,error}=await client.auth.updateUser({password:p.value});if(error)throw error;if(!data?.user)throw new Error('Password update session is not available. Open the reset link again.');await client.auth.signOut();form.reset();show('Password updated successfully. You can now sign in with your new password.','ok');setTimeout(()=>location.replace('login.html'),1200);}catch(err){show(err?.message||'Unable to update the password. Please open the reset link again.','err');}finally{btn.disabled=false}});})();</script></body></html>

:root{
  --bg:#070914;--panel:#0d1120;--panel2:#10172a;--line:#252c40;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
  radial-gradient(circle at 85% 0%,rgba(120,108,255,.18),transparent 28%),
  radial-gradient(circle at 10% 35%,rgba(34,211,238,.06),transparent 25%),
  var(--bg);
  color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  line-height:1.65;
}
a{text-decoration:none;color:inherit}
.wrap{width:min(1120px,calc(100% - 36px));margin:auto}
nav{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-size:19px;font-weight:900;letter-spacing:-.4px}.logo span{color:#9b8cff}
.navlinks{display:flex;gap:20px;align-items:center;color:#aeb7c9;font-size:13px}
.navlinks a:hover{color:#fff}
.navbtn{padding:9px 13px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.025);font-weight:800;color:#e7eaff}
.hero{padding:72px 0 48px}
.eyebrow{display:inline-flex;padding:7px 11px;border:1px solid rgba(124,92,255,.3);border-radius:999px;color:#bcb4ff;font-size:10px;font-weight:900;letter-spacing:1.7px}
h1{font-size:clamp(42px,7vw,72px);line-height:.98;letter-spacing:-3.5px;margin:18px 0}

.lead{max-width:760px;color:#aeb8ca;font-size:17px;line-height:1.75}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:11px;font-size:12px;font-weight:900;transition:.22s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:linear-gradient(135deg,#7c5cff,#4f8cff);color:#fff;box-shadow:0 12px 28px rgba(92,85,255,.2)}
.btn-secondary{border:1px solid rgba(255,255,255,.14);background:#0d1322;color:#e9ecf7}
.btn-cyan{border:1px solid rgba(34,211,238,.3);background:linear-gradient(135deg,rgba(34,211,238,.14),rgba(59,130,246,.1));color:#dffcff}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin:25px 0 55px}
.panel{background:linear-gradient(145deg,rgba(17,24,39,.96),rgba(9,14,26,.98));border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:28px}
.panel h2{margin:0 0 14px;font-size:23px}
.panel p{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:17px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.025)}
.stat strong{display:block;font-size:19px}.stat small{color:#818da2;font-size:10px}
section{padding:34px 0 62px}
.kicker{color:#8f84ff;font-size:10px;font-weight:900;letter-spacing:2px}
.title{font-size:36px;letter-spacing:-1.8px;margin:7px 0 10px}
.muted{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}
.card{padding:22px;border:1px solid var(--line);border-radius:17px;background:#0d1321}
.card h3{margin:0 0 8px;font-size:17px}.card p{margin:0;color:#a1aabd;font-size:13px}
.card ul{margin:12px 0 0;padding-left:18px;color:#cbd4e4;font-size:13px}
.roadmap{display:grid;gap:10px;margin-top:20px}
.step{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;padding:17px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.025)}
.step b{display:flex;width:42px;height:42px;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(135deg,#7c5cff,#22d3ee);font-size:12px}
.step strong{display:block;font-size:14px}.step span{display:block;color:#8995aa;font-size:12px;margin-top:2px}
.cta{margin:10px 0 70px;padding:28px;border-radius:22px;border:1px solid rgba(124,92,255,.3);background:linear-gradient(135deg,rgba(124,92,255,.14),rgba(34,211,238,.06),rgba(9,14,26,.98));display:flex;align-items:center;justify-content:space-between;gap:20px}
.cta h2{margin:0 0 5px;font-size:25px}.cta p{margin:0;color:#9da9bc;font-size:13px}
footer{border-top:1px solid rgba(255,255,255,.08);padding:24px 0 35px;color:#778399;font-size:11px;display:flex;justify-content:space-between}
@media(max-width:800px){.navlinks{display:none}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.cta{display:block}.cta .actions{margin-top:18px}}

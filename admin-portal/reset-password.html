<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | NextGen DevSecOps AI</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070a12;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.box{width:min(430px,calc(100% - 32px));background:#0e1321;border:1px solid #26304a;border-radius:20px;padding:30px;box-shadow:0 25px 80px rgba(0,0,0,.45)}.brand{font-weight:900;color:#bdb5ff}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;color:#65e6ff}.box h1{font-size:30px;margin:10px 0 8px}.sub{color:#9aa5b8;font-size:13px;line-height:1.55;margin:0 0 20px}label{display:block;color:#cbd5e1;font-size:12px;font-weight:800;margin:13px 0 6px}input{width:100%;padding:12px 13px;border:1px solid #303a54;background:#090e19;color:#fff;border-radius:9px;outline:none}input:focus{border-color:#8b5cf6}button,.btn{width:100%;display:inline-flex;justify-content:center;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid #4f46e5;background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff;font-weight:900;cursor:pointer;text-decoration:none;margin-top:18px}.msg{min-height:20px;margin-top:12px;font-size:12px;color:#fbbf24;line-height:1.5}.back{display:block;text-align:center;color:#94a3b8;font-size:12px;text-decoration:none;margin-top:18px}.back:hover{color:#fff}</style></head><body><main class="box"><div class="brand">NextGen DevSecOps AI</div><div class="eyebrow">PASSWORD RESET</div><h1>Set a new password</h1><p class="sub">Enter your new password below.</p><form id="f"><label for="p">New password</label><input id="p" type="password" minlength="8" autocomplete="new-password" required><label for="p2">Confirm password</label><input id="p2" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Update Password →</button><div id="m" class="msg" role="alert"></div></form><a class="back" href="login.html">← Back to login</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const c=window.supabase.createClient('https://hkpvigvtdckxhmnsvdrh.supabase.co','sb_publishable_JlIrNdsEXgjikrh9F_YxYg_DBrgimoQ');document.getElementById('f').addEventListener('submit',async(e)=>{e.preventDefault();const m=document.getElementById('m'),p=document.getElementById('p').value,p2=document.getElementById('p2').value;if(p!==p2){m.textContent='Passwords do not match.';return}try{const {error}=await c.auth.updateUser({password:p});if(error)throw error;m.textContent='Password updated. You can now sign in.';setTimeout(()=>location.href='login.html',1200)}catch(err){m.textContent=err.message||'Unable to update password.'}})</script></body></html>

</head><body><main class="box"><div class="brand">NextGen DevSecOps AI</div><div class="eyebrow">ADMIN PORTAL</div><h1>Admin Login</h1>
<p class="sub">Sign in with your Supabase account to continue.</p>
<form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<div id="turnstile" class="captcha"></div>
<button id="submit" type="submit">Sign in →</button><a class="back" href="reset-password.html" style="margin-top:12px">Forgot password?</a><div id="msg" class="msg" role="alert"></div></form>
<a class="back" href="mfa.html" id="mfaLink" style="display:none">Continue to MFA →</a><a class="back" href="../">← Back to website</a></main>
<script>
const client=window.supabase.createClient(window.NEXTGEN_SUPABASE_URL,window.NEXTGEN_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('loginForm'),msg=document.getElementById('msg'),btn=document.getElementById('submit');
let captchaToken='';
let turnstileWidgetId=null;
let captchaReady=false;
let captchaRendering=false;
window.onTurnstileSuccess=(token)=>{captchaToken=String(token||'');captchaReady=Boolean(captchaToken);msg.textContent='Security check verified ✓';btn.disabled=false;};
window.onTurnstileExpired=()=>{captchaToken='';captchaReady=false;btn.disabled=true;};
window.onTurnstileError=(code)=>{captchaToken='';captchaReady=false;btn.disabled=true;msg.textContent=turnstileErrorMessage(code);};
function turnstileErrorMessage(code){
 const c=String(code||'');
 if(c==='110200') return 'Security check is not authorized for this domain. In Cloudflare Turnstile, add nextgendevsecops.in (and www.nextgendevsecops.in if used) under Hostname Management.';
 if(c==='110100'||c==='110110') return 'Security check configuration is invalid. Verify the Turnstile site key in Cloudflare.';
 if(c==='200100') return 'Security check could not validate because of a clock/cache issue. Check your device time and refresh.';
 return 'Security check could not be completed. Please refresh and try again.';
}
function renderCaptcha(){
 if(captchaRendering||turnstileWidgetId!==null)return;
 if(!window.NEXTGEN_TURNSTILE_SITE_KEY){msg.textContent='Security configuration is incomplete: Turnstile site key is not configured.';btn.disabled=true;return;}
 if(!window.turnstile){setTimeout(renderCaptcha,300);return;}
 captchaRendering=true;
 try{
  turnstileWidgetId=window.turnstile.render('#turnstile',{sitekey:window.NEXTGEN_TURNSTILE_SITE_KEY,theme:'auto',size:'flexible',retry:'auto',refreshExpired:'auto',action:'admin_login',callback:window.onTurnstileSuccess,'expired-callback':window.onTurnstileExpired,'error-callback':window.onTurnstileError});
 }catch(err){captchaRendering=false;msg.textContent='Security check could not be loaded. Please refresh and retry.';btn.disabled=true;setTimeout(renderCaptcha,1000);}
}
btn.disabled=true;
renderCaptcha();
form.addEventListener('submit',async(e)=>{
 e.preventDefault(); msg.textContent='Signing in…'; btn.disabled=true;
 try{
  const token = captchaToken || (window.turnstile && turnstileWidgetId!==null ? turnstile.getResponse(turnstileWidgetId) : '');
  if(!token) throw new Error('Complete the security check before signing in.');
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  // Turnstile is verified server-side by the secure-login Edge Function.
  // This deliberately avoids depending on Supabase Auth's optional CAPTCHA setting.
  const loginUrl = `${window.NEXTGEN_SUPABASE_URL.replace(/\/$/, '')}/functions/v1/secure-login`;
  const response = await fetch(loginUrl, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': window.NEXTGEN_SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${window.NEXTGEN_SUPABASE_ANON_KEY}`,
      'Accept': 'application/json'
    },
    body: JSON.stringify({ email, password, turnstile_token: token })
  });
  const authData = await response.json().catch(()=>({}));
  if(!response.ok){ throw new Error(authData.error || authData.error_description || authData.message || `Unable to sign in (HTTP ${response.status}).`); }
  if(!authData.access_token || !authData.refresh_token) throw new Error('Authentication failed.');
  const {data,error}=await client.auth.setSession({access_token:authData.access_token,refresh_token:authData.refresh_token});
  if(error) throw error;
  if(!data.user) throw new Error('Authentication failed.');
  const {data:profile,error:pe}=await client.from('profiles').select('role,status').eq('id',data.user.id).maybeSingle();
  if(pe) throw pe;
  if(!profile||profile.role!=='admin'||profile.status!=='active'){
    await client.auth.signOut(); throw new Error('This account is not an active admin account.');
  }
  const {data:aal,error:ae}=await client.auth.mfa.getAuthenticatorAssuranceLevel(); if(ae) throw ae; if(aal.currentLevel==='aal2') location.replace('index.html'); else location.replace('mfa.html');
 }catch(err){
  msg.textContent=err.message||'Unable to sign in.';btn.disabled=false;captchaToken='';captchaReady=false;
  if(window.turnstile && turnstileWidgetId!==null) try{window.turnstile.reset(turnstileWidgetId);}catch(_ ){}
 }
});
</script></body></html>

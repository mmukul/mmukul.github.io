<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | NextGen DevSecOps AI</title><style>
:root{--bg:#070a12;--panel:#101629;--line:#29324a;--text:#f8fafc;--muted:#9aa5b8;--violet:#8b5cf6;--cyan:#22d3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0%,rgba(124,58,237,.2),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,Arial}.box{width:min(460px,calc(100% - 28px));background:linear-gradient(145deg,#11182a,#0b1020);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 30px 80px #0007}.logo{font-weight:900}.logo span{color:#a78bfa}.eyebrow{margin-top:28px;color:#67e8f9;font-size:10px;font-weight:900;letter-spacing:2px}.box h1{font-size:34px;letter-spacing:-1.5px;margin:8px 0}.box p{color:var(--muted);font-size:13px}label{display:block;color:#cbd5e1;font-size:11px;font-weight:700;margin:17px 0 7px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#080d18;color:#fff;outline:0}input:focus{border-color:#7c3aed}.btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-weight:900;cursor:pointer}.msg{display:none;margin-top:14px;padding:11px;border-radius:9px;font-size:11px;background:#24151a;color:#fca5a5}.msg.show{display:block}.setup{display:none;margin-top:15px;font-size:11px;color:#fbbf24}.setup.show{display:block}.back{display:block;margin-top:22px;text-align:center;color:#9aa5b8;font-size:11px}</style></head><body><main class="box"><div class="logo">NextGen <span>DevSecOps AI</span></div><div class="eyebrow">ADMIN PORTAL</div><h1>Secure Admin Login</h1><p>Manage students, courses, batches, assignments and LMS access.</p><form id="form"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" id="btn">Login to Admin Portal →</button></form><div id="msg" class="msg"></div><div id="setup" class="setup">Configure <code>admin-portal/js/supabase-config.js</code> first.</div><a class="back" href="../">← Back to website</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script>
const msg=document.getElementById('msg'),setup=document.getElementById('setup');function show(t){msg.textContent=t;msg.className='msg show'}if(!NEXTGEN_SUPABASE_CONFIGURED)setup.classList.add('show');const sb=NEXTGEN_SUPABASE_CONFIGURED?supabase.createClient(NEXTGEN_SUPABASE_URL,NEXTGEN_SUPABASE_ANON_KEY):null;(async()=>{if(!sb)return;const {data:{session}}=await sb.auth.getSession();if(session) location.replace('./')})();document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!sb)return show('Supabase is not configured.');const b=document.getElementById('btn');b.disabled=true;b.textContent='Checking access…';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){b.disabled=false;b.textContent='Login to Admin Portal →';return show(error.message)}const {data:p,error:pe}=await sb.from('profiles').select('role,status').single();if(pe||!p||p.role!=='admin'||p.status==='inactive'){await sb.auth.signOut();b.disabled=false;b.textContent='Login to Admin Portal →';return show('Access denied. This account is not an active administrator.')}location.replace('./')});
</script></body></html>
